    .header { display: flex; align-items: center; gap: 0.75rem; }

    @keyframes comboPop {

      40% { transform: scale(1.28); }

      transform: translateY(4px);
      pointer-events: none;
      transition: opacity 0.15s, transform 0.15s;
    }
    .combo-badge.on { opacity: 1; transform: translateY(0); }

    .canvas-wrap {
      position: relative;
      width: 100%;
      max-width: 420px;
      border-radius: 1rem;
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: var(--wrap-shadow);
      cursor: pointer;
      transition: transform 0.08s linear;
      min-width: 0;
    }
    .canvas-wrap.shake { animation: ratShake 0.28s ease; }
    .canvas-wrap.near-flash::after {
      content: '';
      position: absolute; inset: 0;
      background: rgba(255,107,53,0.14);
      pointer-events: none;
      animation: nearFlash 0.28s ease;
    }
    @keyframes ratShake {
      0%, 100% { transform: translate(0, 0); }
      25% { transform: translate(-3px, 1px); }
      50% { transform: translate(3px, -2px); }
      75% { transform: translate(-2px, 1px); }
    }
    @keyframes nearFlash { 0% { opacity: 1; } 100% { opacity: 0; } }
    canvas#c {
      display: block;
      width: 100%;
      height: auto;
      max-width: 100%;
    }

    .toast {
      position: absolute;
      left: 50%;
      bottom: 1rem;
      transform: translateX(-50%) translateY(8px);
      background: rgba(0,0,0,0.78);
      color: #fff;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      padding: 0.4rem 0.75rem;
      border-radius: 999px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
      z-index: 3;
      white-space: nowrap;
      max-width: calc(100% - 1rem);
      overflow: hidden;
      text-overflow: ellipsis;
      box-sizing: border-box;
    }
    html[data-theme="light"] .toast { background: rgba(28,26,22,0.88); }
    .toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }

    .overlay {
      position: absolute; inset: 0;

      display: flex; flex-direction: column;

      border-radius: 999px;
      background: linear-gradient(90deg, #f0c040, #ff6b35);
      transition: width 0.3s ease;
      width: 0%;
    }
  </style>

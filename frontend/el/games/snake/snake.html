  <script>
  (function () {
    function loadMailAds() {
      if (document.querySelector('script[src*="ads-async.js"]')) return;
      var s = document.createElement('script');
      s.async = true;
      s.src = 'https://ad.mail.ru/static/ads-async.js';
      document.head.appendChild(s);
    }
    function schedule() {
      if ('requestIdleCallback' in window) {
        requestIdleCallback(function () { setTimeout(loadMailAds, 2000); }, { timeout: 5000 });
      } else {
        setTimeout(loadMailAds, 2500);
      }
    }
    if (document.readyState === 'complete') schedule();
    else window.addEventListener('load', schedule);
  })();
</script>

<body>
  <div id="menuContainer"></div>

  <script>
  (function(){
    function isMobile(){
      return /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || (window.innerWidth < 768);
    }
    function showInstructions(){
      try{
        if (localStorage.getItem('game_instructions_snake_shown') === '1') return;
        try { if (new URLSearchParams(location.search).get('rec')) return; } catch(e) {}

        var ov = document.createElement('div');
        ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:9998;';

        var box = document.createElement('div');
        box.style.cssText = 'max-width:90vw;background:#141821;color:#fff;border:1px solid #1f2632;border-radius:12px;padding:16px;text-align:left;';

        var h = document.createElement('h3');
        h.textContent = 'So spielt man — Snake';
        h.style.margin = '0 0 8px';

        var p = document.createElement('div');
        p.style.cssText = 'font-size:14px;line-height:1.5;white-space:pre-line';
        p.textContent = isMobile() ? window.i18n.instructionsMobile : window.i18n.instructionsDesktop;

        var btn = document.createElement('button');
        btn.className = 'btn';
        btn.textContent = 'Verstanden';
        btn.style.marginTop = '10px';
        btn.onclick = function(){
          localStorage.setItem('game_instructions_snake_shown','1');
          ov.remove();
        };

        box.appendChild(h);
        box.appendChild(p);
        box.appendChild(btn);
        ov.appendChild(box);
        document.body.appendChild(ov);
      }catch(e){}
    }
    document.addEventListener('DOMContentLoaded', showInstructions);
  })();
  </script>

  <div class="page">
    <div class="ad-top-banner" style="text-align:center;margin:16px 0;">
      <ins class="mrg-tag" style="display:inline-block;" data-ad-client="ad-1897960" data-ad-slot="1897960"></ins>

    <header>
      <img src="/frontend/images/snake.png" width="28" height="28" alt="Spiele" style="border-radius:6px;">
      <h1>Snake <span class="brand-tag">Serpmonn</span></h1>
    </header>

    <div class="wrap">
      <div class="panel playfield" id="shakeLayer">
        <canvas id="game" width="480" height="480" aria-label="Spielfeld"></canvas>
        <div class="hint">Controls: arrows or WASD. Pause — Space. Restart — R. Combo grows with apples in a row (resets on pause).</div>
      </div>

      <div class="panel">
        <h2>Statistik</h2>

        <div class="stats">
          <div class="stat">Punkte<br><b id="score">0</b></div>
          <div class="stat">Rekord<br><b id="best">0</b></div>
        </div>

        <div class="stats">
          <div class="stat">Geschwindigkeit<br><b id="speed">1x</b></div>
          <div class="stat">Combo<br><b id="combo">—</b></div>
        </div>

        <div class="stats">
          <div class="stat">Nick<br><b id="nickValue">—</b></div>
          <div class="stat">Field<br><b>24×24</b></div>
        </div>

        <label class="mode-label" for="modeSelect">Mode</label>
        <select id="modeSelect" class="mode-select" aria-label="Game mode">
          <option value="classic">Classic — wrap edges</option>
          <option value="walls">Walls — solid walls</option>
          <option value="portals">Portals — portals</option>
        </select>

        <form id="nicknameForm" class="nickname-panel">
          <label for="nickname">Leaderboard nickname (optional)</label>
          <input type="text" id="nickname" maxlength="24" placeholder="Your nick" autocomplete="nickname">
          <div class="action-row">
            <button type="submit" class="btn primary">Save</button>
            <button type="button" class="btn" id="btnSkipNick">Skip</button>
          </div>
        </form>

        <div class="action-row">
          <button class="btn primary" id="btnStart">Έναρξη</button>
          <button class="btn" id="btnPause">Παύση</button>
          <button class="btn" id="btnReset">Neu</button>
        </div>
        <div class="action-row">
          <button class="btn" id="btnChangeNick" type="button">Change nick</button>
          <button class="btn" id="btnSound" type="button" aria-pressed="true">Sound: on</button>
          <button class="btn" id="btnLeaderboard" type="button">Leaderboard</button>
        </div>

        <div class="controls" aria-label="Mobile Steuerung">
          <div></div>
          <button class="btn" data-dir="up">▲</button>
          <div></div>
          <button class="btn" data-dir="left">◀</button>
          <button class="btn" data-dir="down">▼</button>
          <button class="btn" data-dir="right">▶</button>
        </div>
      </div>
    </div>
  </div>

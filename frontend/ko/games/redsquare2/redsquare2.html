    <script>
  (function () {
    function loadMailAds() {
      if (document.querySelector('script[src*="ads-async.js"]')) return;
      var s = document.createElement('script');
      s.async = true;
      s.src = 'https://ad.mail.ru/static/ads-async.js';
      document.head.appendChild(s);
    }
    function schedule() {
      if ('requestIdleCallback' in window) {
        requestIdleCallback(function () { setTimeout(loadMailAds, 2000); }, { timeout: 5000 });
      } else {
        setTimeout(loadMailAds, 2500);
      }
    }
    if (document.readyState === 'complete') schedule();
    else window.addEventListener('load', schedule);
  })();
</script>
    <script>
    /* Закрытие инструкции без module/defer — в VK WebView модуль может опоздать */
    window.__rs2DismissInstruction = function (e) {
      if (e) {
        try { e.preventDefault(); } catch (_) {}
        try { e.stopPropagation(); } catch (_) {}
      }
      var overlay = document.getElementById('instructionOverlay');
      if (!overlay || overlay.classList.contains('is-hidden')) return false;
      overlay.classList.add('is-hidden');
      overlay.hidden = true;
      overlay.style.cssText = 'display:none!important;pointer-events:none!important';
      overlay.setAttribute('aria-hidden', 'true');
      var form = document.getElementById('nicknameForm');
      if (form) form.hidden = false;
      try { window.dispatchEvent(new Event('resize')); } catch (_) {}
      return false;
    };
    </script>

<body class="rs2-page">
    <div class="instruction-overlay" id="instructionOverlay">
        <div class="instruction-content">
            <h2 class="instruction-title">떨어지는 파란 사각형 플레이 방법</h2>
            <ul class="instruction-list">
                <li><strong>조작:</strong> 방향키 또는 터치로 빨간 사각형을 좌우로 이동</li>
                <li><strong>목표:</strong> 하단 플랫폼으로 떨어지는 도형을 잡으세요</li>
                <li><strong>점수:</strong> 잡은 도형마다 1점을 얻습니다</li>
                <li><strong>실수:</strong> 도형이 바닥에 닿으면 미스로 처리됩니다</li>
                <li><strong>게임 오버:</strong> 미스 10회 후 게임이 종료됩니다</li>
                <li><strong>리더보드:</strong> 게임 후 결과 확인</li>
                <li><strong>일시정지:</strong> 일시정지 버튼으로 멈추기</li>
            </ul>
            <button type="button" class="instruction-button" id="understandBtn"
                onclick="return window.__rs2DismissInstruction(event)"
                ontouchend="return window.__rs2DismissInstruction(event)">알겠어요, 시작!</button>
        </div>
    </div>
    <script>
    (function () {
      var overlay = document.getElementById('instructionOverlay');
      var btn = document.getElementById('understandBtn');
      if (btn) {
        btn.addEventListener('click', window.__rs2DismissInstruction, true);
        btn.addEventListener('touchend', window.__rs2DismissInstruction, { capture: true, passive: false });
      }
      if (overlay) {
        overlay.addEventListener('click', function (e) {
          if (e.target === overlay) window.__rs2DismissInstruction(e);
        }, true);
      }
    })();
    </script>

            <div class="actions" id="gameActions">
                <button type="button" class="action-btn action-pause" id="pauseBtn" hidden>일시정지</button>
                <button type="button" class="action-btn action-restart" id="restartBtn" hidden>다시</button>
                <button type="button" class="action-btn action-lb" id="leaderboardBtn">리더보드</button>

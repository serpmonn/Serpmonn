    <h1>📐 포맷 변환기</h1>
    <p class="tool-lead">이미지를 변환하고 결과를 다운로드하세요: PNG, JPEG, WEBP, AVIF, BMP, ICO.</p>
    <div class="calculator-container">
      <h2>이미지</h2>
      <div id="error-message" class="error-message hidden" role="alert"></div>
      <div class="input-section">
        <div class="input-group">
          <label for="file">파일</label>
          <input id="file" type="file" accept="image/*,.bmp,.ico,.gif,.tif,.tiff,.avif,.webp,.jpg,.jpeg,.png">
        </div>
        <div class="input-group">
          <label for="format">출력 형식</label>
          <select id="format">
            <option value="png">PNG</option>
            <option value="jpeg">JPEG</option>
            <option value="webp">WEBP</option>
            <option value="avif">AVIF</option>
            <option value="bmp">BMP</option>
            <option value="ico">ICO</option>
          </select>
        </div>
        <div class="input-group" id="quality-group">
          <label for="quality">JPEG/WEBP 품질</label>
          <input id="quality" type="number" min="10" max="100" value="90">
        </div>
      </div>
      <div class="action-bar action-bar--split">
        <button type="button" class="calculate-btn" id="btn-convert">변환</button>
        <button type="button" class="download-btn" id="btn-download" disabled>다운로드</button>
        <details class="more-actions">
          <summary>더보기</summary>
          <div class="more-actions__list">
            <button type="button" id="btn-reset">초기화</button>
            <button type="button" id="btn-share">공유</button>
          </div>
        </details>
      </div>
      <div class="results">
        <h3>결과</h3>
        <div class="result-hero">
          <div class="result-value" id="heroResult">—</div>
          <div class="result-label" id="info"></div>
        </div>
        <p id="download-hint" class="download-hint hidden">완료 — 다운로드를 클릭해 기기에 저장하세요.</p>
        <img id="preview" class="preview-img hidden" alt="미리보기">
        <p class="result-disclaimer">파일은 브라우저에서만 처리됩니다. 변환 후 다운로드를 클릭하세요.</p>
      </div>

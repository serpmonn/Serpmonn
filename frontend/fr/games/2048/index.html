<body>
    <script>
      (function(){
        function isMobile(){ return /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || (window.innerWidth < 768); }
        function showInstructions(){
          try{
            var old = document.querySelector('.instructions'); if(old) old.style.display='none';
            if (localStorage.getItem('game_instructions_2048_shown') === '1') return;
            var ov = document.createElement('div');
            ov.id = 'game-instructions-overlay';
            ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:9998;';
            var box = document.createElement('div');
            box.style.cssText = 'max-width:90vw;background:#141821;color:#fff;border:1px solid #1f2632;border-radius:12px;padding:16px;box-shadow:0 8px 30px rgba(0,0,0,.4);text-align:left;';
            var h = document.createElement('h3'); h.textContent = 'Как играть — 2048'; h.style.margin='0 0 8px';
            var p = document.createElement('div');
            p.style.cssText='font-size:14px;line-height:1.5;white-space:pre-line';
            if (isMobile()) {
              p.textContent = '• Свайпы влево/вправо/вверх/вниз — движение плиток\n• Кнопки: «Новая игра», «Отменить»';
            } else {
              p.textContent = '• Стрелки ← ↑ → ↓ — движение плиток\n• Кнопки под полем: «Новая игра», «Отменить»';
            }
            var btn = document.createElement('button'); btn.textContent='Понятно';
            btn.className='btn'; btn.style.marginTop='10px'; btn.onclick=function(){ ov.remove(); localStorage.setItem('game_instructions_2048_shown','1'); };
            box.appendChild(h); box.appendChild(p); box.appendChild(btn); ov.appendChild(box); document.body.appendChild(ov);
          }catch(_){}
        }
        document.addEventListener('DOMContentLoaded', showInstructions);
      })();
    </script>
    <div class="container">

# Legacy URL redirects — include inside server { } for serpmonn.ru
# news → knowledge-base, login/register → auth, ?lang= → locale path, ku-Arab → ku-arab

# Russian (no locale prefix)
rewrite ^/frontend/news/news\.html$ /frontend/knowledge-base/knowledge-base.html permanent;
rewrite ^/frontend/news/rss\.xml$ /frontend/knowledge-base/rss.xml permanent;
rewrite ^/frontend/news/articles/(.+)$ /frontend/knowledge-base/articles/$1 permanent;

# Localized frontend paths
rewrite ^/frontend/([^/]+)/news/news\.html$ /frontend/$1/knowledge-base/knowledge-base.html permanent;
rewrite ^/frontend/([^/]+)/news/rss\.xml$ /frontend/$1/knowledge-base/rss.xml permanent;
rewrite ^/frontend/([^/]+)/news/articles/(.+)$ /frontend/$1/knowledge-base/articles/$2 permanent;

# login / register stubs → unified auth page (tab=login|register)
rewrite ^/frontend/login/login\.html$ /frontend/auth/auth.html?tab=login permanent;
rewrite ^/frontend/register/register\.html$ /frontend/auth/auth.html?tab=register permanent;
rewrite ^/frontend/([^/]+)/login/login\.html$ /frontend/$1/auth/auth.html?tab=login permanent;
rewrite ^/frontend/([^/]+)/register/register\.html$ /frontend/$1/auth/auth.html?tab=register permanent;

# ?lang=xx on RU (unprefixed) frontend pages → /frontend/xx/...
# Drops the query string on purpose (locale is in the path).
set $serp_lang_redir "";
if ($arg_lang ~* "^(ar|az|be|bg|bn|cs|da|de|dv|el|en|es|es-419|fa|fi|fil|fr|he|hi|hu|hy|id|it|ja|ka|kk|ko|ks|ku-arab|ku-Arab|ms|nb|nl|pl|ps|pt-br|pt-pt|ro|sd|sr|sv|th|tr|ug|ur|uz|vi|yi|zh-cn)$") {
    set $serp_lang_redir $arg_lang;
}
if ($serp_lang_redir ~* "^ku-Arab$") {
    set $serp_lang_redir "ku-arab";
}
if ($serp_lang_redir != "") {
    rewrite ^/frontend/(tools|games|knowledge-base|profile|auth|poleznoe|tariffs|promo-codes-and-discounts|privacy-policy|ad-info|donate|about-project|improve|offer|login|register)/(.*)$ /frontend/$serp_lang_redir/$1/$2? permanent;
}

# Legacy ku-Arab locale folder (case-sensitive)
rewrite ^/frontend/ku-Arab/(.*)$ /frontend/ku-arab/$1 permanent;
rewrite ^/ku-Arab/(.*)$ /ku-arab/$1 permanent;

# Removed X-Car partner landing
rewrite ^/frontend/Partners/X-Car\.html$ /frontend/ad-info/ad-info.html permanent;

# Shared static after locale cleanup (old relative / cached paths)
rewrite ^/frontend/[^/]+/(scripts|styles|images|fonts|pwa|i18n)/(.*)$ /frontend/$1/$2 last;

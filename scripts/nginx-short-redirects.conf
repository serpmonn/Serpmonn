# Short public URLs → long frontend paths.
# Source of truth in git: scripts/nginx-short-redirects.conf
# Include inside the main server { } block:
#   destin: include /var/www/serpmonn-dev/scripts/nginx-short-redirects.conf;
#   prod:   include /var/www/serpmonn.ru/scripts/nginx-short-redirects.conf;
#
# After editing: nginx -t && nginx -s reload
# (same file is in both trees; keep destin/prod copies in sync via git)

location ~* ^/games/?$ {
    return 301 /frontend/games/games.html;
}
location ~* ^/partners/?$ {
    return 301 /frontend/partners/index.html;
}
location ~* ^/neon-runner/?$ {
    return 301 /frontend/downloads/neon-runner/;
}
location ~* ^/neon-runner/en/?$ {
    return 301 /frontend/downloads/neon-runner/en/;
}
location ~* ^/serphold/?$ {
    return 301 /frontend/downloads/serphold/;
}
location ~* ^/animals/?$ {
    return 301 /frontend/downloads/animals/;
}
location ~* ^/donate/?$ {
    return 301 /frontend/donate/donate.html;
}

# Short public URLs.
# Source of truth in git: scripts/nginx-short-redirects.conf
# Include inside the main server { } block:
#   destin: include /var/www/serpmonn-dev/scripts/nginx-short-redirects.conf;
#   prod:   include /var/www/serpmonn.ru/scripts/nginx-short-redirects.conf;
#
# After editing: nginx -t && nginx -s reload
# (same file is in both trees; keep destin/prod copies in sync via git)
#
# APK landings: serve 200 at the pretty URL (matches <link rel="canonical">).
# A 301 to /frontend/downloads/... breaks Google Video Search
# ("video not on the watch page").

location ~* ^/games/?$ {
    return 301 /frontend/games/games.html;
}
location ~* ^/partners/?$ {
    return 301 /frontend/partners/index.html;
}
location ~* ^/neon-runner/?$ {
    try_files /frontend/downloads/neon-runner/index.html =404;
}
location ~* ^/neon-runner/en/?$ {
    try_files /frontend/downloads/neon-runner/en/index.html =404;
}
location ~* ^/serphold/?$ {
    try_files /frontend/downloads/serphold/index.html =404;
}
location ~* ^/serphold/en/?$ {
    try_files /frontend/downloads/serphold/en/index.html =404;
}
location ~* ^/animals/?$ {
    try_files /frontend/downloads/animals/index.html =404;
}
location ~* ^/animals/en/?$ {
    try_files /frontend/downloads/animals/en/index.html =404;
}
location ~* ^/store/?$ {
    try_files /frontend/store/index.html =404;
}
location ~* ^/store/en/?$ {
    try_files /frontend/store/en/index.html =404;
}
location ~* ^/donate/?$ {
    return 301 /frontend/donate/donate.html;
}

# /promo без ?code= → каталог; с ?code= → карточка /frontend/promo/
location = /promo {
    if ($arg_code = "") {
        return 302 /frontend/promo-codes-and-discounts/promokody-skidki.html;
    }
    try_files /frontend/promo/index.html =404;
}
location ^~ /promo {
    try_files /frontend/promo/index.html =404;
}
